#
# Ambient Healthcare Agents QA: deploys the provider (ambient-scribe with the
# local Parakeet ASR NIM), the patient agent (full-agent-ui) and the patient
# voice UI with Docker Compose, then runs testcases/ambient-healthcare/ of
# gitlab-master.nvidia.com/cloud-service-qa/Blueprint/blueprint-github-test
# from its pre-built test image. LLMs, guardrails and the patient Riva ASR/TTS
# use hosted NVIDIA endpoints.
#
# Repository secrets: NGC_API_KEY, NVIDIA_API_KEY, TEST_DOCKER_PULL_KEY,
# SMTP_USERNAME, SMTP_PASSWORD.

name: Ambient Healthcare Agents QA

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_image:
        description: >-
          Test image to run the suite from. Override with :branch-<slug> to try
          a suite change before it merges, or with :<short-sha> to pin a build.
        required: false
        default: nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROVIDER_DIR: ambient-provider/ambient-scribe
  PATIENT_DIR: ambient-patient

jobs:
  ambient-healthcare-qa:
    runs-on: arc-runners-org-nvidia-ai-bp-1-gpu
    timeout-minutes: 180
    env:
      TEST_IMAGE: ${{ inputs.test_image || 'nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest' }}
      PYTEST_SELECTION: ambient_provider or ambient_patient_voice or ambient_patient_agent

    steps:
      - name: Checkout blueprint (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Preflight - secrets, GPU and tooling
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: |
          set -euo pipefail
          for name in NGC_API_KEY NVIDIA_API_KEY TEST_DOCKER_PULL_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret ${name} is not set."
              exit 1
            fi
          done
          nvidia-smi
          docker version --format '{{.Server.Version}}'
          docker compose version --short
          df -h .
          git submodule status

      - name: Log in to nvcr.io for the NIM and base images
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        run: |
          set -euo pipefail
          echo "${NGC_API_KEY}" | docker login nvcr.io --username '$oauthtoken' --password-stdin

      - name: Deploy ambient provider (API, UI, local Parakeet NIM)
        working-directory: ${{ env.PROVIDER_DIR }}
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          cp apps/api/dot_env_example apps/api/.env
          sed -i '/^NVIDIA_API_KEY=/d;/^OPENAI_BASE_URL=/d;/^RIVA_URI=/d' apps/api/.env
          {
            printf 'NVIDIA_API_KEY=%s\n' "${NVIDIA_API_KEY}"
            echo 'OPENAI_BASE_URL=https://integrate.api.nvidia.com/v1'
            echo 'RIVA_URI=parakeet-nim:50051'
          } >> apps/api/.env
          cp apps/ui/.env.example apps/ui/.env
          ./scripts/validate-env.sh
          mkdir -p apps/api/uploads
          chmod a+rwx apps/api/uploads
          docker compose -f infra/compose.dev.yml --profile riva-nim up --build -d parakeet-nim api ui

      - name: Deploy ambient patient agent (app-server, full-agent-ui)
        working-directory: ${{ env.PATIENT_DIR }}
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          sed -i '/^NVIDIA_API_KEY=/d;/^NGC_API_KEY=/d' agent/vars.env
          {
            printf 'NVIDIA_API_KEY="%s"\n' "${NVIDIA_API_KEY}"
            printf 'NGC_API_KEY="%s"\n' "${NGC_API_KEY}"
          } >> agent/vars.env
          docker compose -f agent/docker-compose.yaml up --build -d app-server full-agent-ui

      - name: Deploy ambient patient voice interface (ace-controller)
        working-directory: ${{ env.PATIENT_DIR }}
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          env_file=ace-controller-voice-interface/ace_controller.env
          sed -i '/^NGC_API_KEY=/d;/^NVIDIA_API_KEY=/d' "${env_file}"
          {
            printf 'NGC_API_KEY=%s\n' "${NGC_API_KEY}"
            printf 'NVIDIA_API_KEY=%s\n' "${NVIDIA_API_KEY}"
          } >> "${env_file}"
          grep -q '^CONFIG_PATH=./configs/config_riva_public_endpoints.yaml' "${env_file}"
          docker compose --profile ace-controller -f ace-controller-voice-interface/docker-compose.yml up --build -d

      - name: Wait for all services
        run: |
          set -euo pipefail
          wait_for() {
            local url="$1" limit="$2" start
            start=$(date +%s)
            until curl -sf -o /dev/null "${url}"; do
              if [ $(( $(date +%s) - start )) -ge "${limit}" ]; then
                echo "::error::${url} not ready after ${limit}s"
                docker ps -a
                exit 1
              fi
              sleep 10
            done
            echo "${url} ready after $(( $(date +%s) - start ))s"
          }
          wait_for http://localhost:9000/v1/health/ready 1800
          wait_for http://localhost:8000/api/health/ 600
          wait_for http://localhost:5173/ 600
          wait_for http://localhost:7861/full-assistant 600
          wait_for http://localhost:4400/ 900

      - name: Log in to nvcr.io and pull the test image
        env:
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: |
          set -euo pipefail
          echo "${TEST_DOCKER_PULL_KEY}" | docker login nvcr.io --username '$oauthtoken' --password-stdin
          docker pull "${TEST_IMAGE}"

      - name: Run the ambient healthcare test suite
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/reports"
          docker run --rm \
            --network host \
            -v "${GITHUB_WORKSPACE}/reports:/workspace" \
            -w /app \
            "${TEST_IMAGE}" \
            pytest -m "${PYTEST_SELECTION}" \
              --ambient-provider-playground-url http://localhost:5173 \
              --ambient-patient-voice-ui-url http://localhost:4400 \
              --ambient-agent-ui-url http://localhost:7861 \
              --timeout=600 \
              --disable-warnings -v \
              --junitxml=/workspace/ambient-junit.xml \
              --html=/workspace/ambient.html --self-contained-html
          test -s "${GITHUB_WORKSPACE}/reports/ambient-junit.xml"

      - name: Collect deployment logs
        if: always()
        run: |
          set -uo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/reports"
          docker ps -a > "${GITHUB_WORKSPACE}/reports/docker-ps.txt" 2>&1 || true
          docker compose -f "${PROVIDER_DIR}/infra/compose.dev.yml" --profile riva-nim logs --no-color \
            > "${GITHUB_WORKSPACE}/reports/provider-compose.log" 2>&1 || true
          docker compose -f "${PATIENT_DIR}/agent/docker-compose.yaml" logs --no-color \
            > "${GITHUB_WORKSPACE}/reports/patient-agent-compose.log" 2>&1 || true
          docker compose --profile ace-controller -f "${PATIENT_DIR}/ace-controller-voice-interface/docker-compose.yml" logs --no-color \
            > "${GITHUB_WORKSPACE}/reports/patient-voice-compose.log" 2>&1 || true

      - name: Tear down the stacks
        if: always()
        run: |
          set -uo pipefail
          docker compose --profile ace-controller -f "${PATIENT_DIR}/ace-controller-voice-interface/docker-compose.yml" down -v --remove-orphans || true
          docker compose -f "${PATIENT_DIR}/agent/docker-compose.yaml" down -v --remove-orphans || true
          docker compose -f "${PROVIDER_DIR}/infra/compose.dev.yml" --profile riva-nim down -v --remove-orphans || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambient-healthcare-qa-reports
          path: reports/
          retention-days: 30

      - name: Notify
        if: always()
        uses: dawidd6/action-send-mail@6e71c855c9a091d80a519621b9fd3e8d252ca40c
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Ambient Healthcare Agents QA ${{ job.status }} - ${{ github.repository }}@${{ github.ref_name }}"
          to: Github-Action-Blueprint-QA@nvidia.com
          from: github-workflow-notification@gmail.com
          html_body: |
            <p>Ambient Healthcare Agents QA finished with status
            <strong>${{ job.status }}</strong>.</p>
            <p>Repository: ${{ github.repository }}<br>
            Ref: ${{ github.ref_name }}<br>
            Selection: <code>-m ${{ env.PYTEST_SELECTION }}</code></p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
            View the run and download ambient.html</a></p>
