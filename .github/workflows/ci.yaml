#
# Ambient Healthcare Agents end-to-end UI regression. Deploys the three stacks
# with Docker Compose on a 1-GPU self-hosted runner (Parakeet ASR NIM with
# diarization on GPU 0, every LLM on the NVIDIA API Catalog), then runs the UI
# suite from the pre-built blueprint-github-test image against them.
#
# The suite lives in gitlab-master.nvidia.com/cloud-service-qa/Blueprint/
# blueprint-github-test under testcases/ambient-healthcare/.
#
# Coverage (DevTest templates):
#   ambient_provider       T5429454 T5429455 T5429456 T5429458 T5429459
#   ambient_patient_agent  T5429477 T5429478 T5429464 T5429465 T5459935 T5459936 T5459937
#   ambient_patient_voice  T5429462 T5429463
#
# Required repository secrets:
#   TEST_DOCKER_PULL_KEY  NGC key with pull access to the private test image
#   NGC_API_KEY           pulls the Parakeet ASR NIM
#   NVIDIA_API_KEY        API Catalog inference key
#   TAVILY_API_KEY        web search key of the patient agent
#   SMTP_USERNAME / SMTP_PASSWORD   for the email notification step

name: Ambient Healthcare Agents CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_image:
        description: >-
          Test image to run the suite from. Override with :branch-<slug> to try
          a suite change before it merges, or :<short-sha> to pin a build.
        required: false
        default: nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROVIDER_DIR: ambient-provider/ambient-scribe
  PROVIDER_COMPOSE: infra/compose.dev.yml
  AGENT_COMPOSE: ambient-patient/agent/docker-compose.yaml
  VOICE_COMPOSE: ambient-patient/ace-controller-voice-interface/docker-compose.yml
  PYTEST_MARKER: ambient_provider or ambient_patient_voice or ambient_patient_agent

jobs:
  ambient-healthcare-e2e:
    runs-on: arc-runners-org-nvidia-ai-bp-1-gpu
    timeout-minutes: 180
    env:
      TEST_IMAGE: ${{ inputs.test_image || 'nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest' }}

    steps:
      - name: Checkout blueprint (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Preflight - GPU, Docker, secrets
        env:
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          set -euo pipefail
          nvidia-smi
          docker version --format '{{.Server.Version}}'
          docker compose version --short
          df -h .
          missing=0
          for name in TEST_DOCKER_PULL_KEY NGC_API_KEY NVIDIA_API_KEY TAVILY_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::secret ${name} is not set"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Log in to nvcr.io and pull the test image
        env:
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: |
          set -euo pipefail
          echo "${TEST_DOCKER_PULL_KEY}" \
            | docker login nvcr.io --username '$oauthtoken' --password-stdin
          docker pull "${TEST_IMAGE}"

      - name: Deploy ambient provider (Parakeet ASR NIM + API + UI)
        working-directory: ${{ env.PROVIDER_DIR }}
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          cp apps/api/dot_env_example apps/api/.env
          sed -i \
            -e "s|^NVIDIA_API_KEY=.*|NVIDIA_API_KEY=${NVIDIA_API_KEY}|" \
            -e "s|^OPENAI_BASE_URL=.*|OPENAI_BASE_URL=https://integrate.api.nvidia.com/v1|" \
            -e "s|^RIVA_URI=.*|RIVA_URI=parakeet-nim:50051|" \
            -e "s|^SELF_HOSTED=.*|SELF_HOSTED=true|" \
            apps/api/.env
          echo "VITE_USE_STREAMING=true" > apps/ui/.env
          bash scripts/validate-env.sh
          # Only the ASR NIM runs locally; llama-nim of the same profile is left out (LLM on API Catalog).
          docker compose -f "${PROVIDER_COMPOSE}" --profile riva-nim up --build -d parakeet-nim api ui

      - name: Deploy ambient patient agent (app server + full agent UI)
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          set -euo pipefail
          vars=ambient-patient/agent/vars.env
          sed -i \
            -e "s|^NVIDIA_API_KEY=.*|NVIDIA_API_KEY=\"${NVIDIA_API_KEY}\"|" \
            -e "s|^NGC_API_KEY=.*|NGC_API_KEY=\"${NGC_API_KEY}\"|" \
            -e "s|^TAVILY_API_KEY=.*|TAVILY_API_KEY=\"${TAVILY_API_KEY}\"|" \
            -e "s|^AGENT_LLM_BASE_URL=.*|AGENT_LLM_BASE_URL=\"https://integrate.api.nvidia.com/v1\"|" \
            -e "s|^LANGSMITH_TRACING=.*|LANGSMITH_TRACING=false|" \
            "${vars}"
          docker compose -f "${AGENT_COMPOSE}" up --build -d app-server full-agent-ui

      - name: Deploy ambient patient voice (ACE controller + WebRTC UI)
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          envfile=ambient-patient/ace-controller-voice-interface/ace_controller.env
          sed -i \
            -e "s|^NGC_API_KEY=.*|NGC_API_KEY=${NGC_API_KEY}|" \
            -e "s|^NVIDIA_API_KEY=.*|NVIDIA_API_KEY=${NVIDIA_API_KEY}|" \
            -e "s|^CONFIG_PATH=.*|CONFIG_PATH=./configs/config_riva_public_endpoints.yaml|" \
            "${envfile}"
          docker compose --profile ace-controller -f "${VOICE_COMPOSE}" up --build -d

      - name: Wait for every service
        run: |
          set -euo pipefail
          wait_for() {
            local url="$1" limit="$2" waited=0
            until curl -sf -o /dev/null "${url}"; do
              if [ "${waited}" -ge "${limit}" ]; then
                echo "::error::${url} not ready after ${limit}s"
                exit 1
              fi
              sleep 10
              waited=$((waited + 10))
            done
            echo "ready: ${url} (${waited}s)"
          }
          wait_for http://localhost:9000/v1/health 1200
          wait_for http://localhost:8000/api/health/ 600
          wait_for http://localhost:5173/ 600
          wait_for http://localhost:7861/full-assistant 600
          wait_for http://localhost:4400/ 900

      - name: Run the ambient healthcare UI suite
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/reports"
          docker run --rm \
            --network host \
            -v "${GITHUB_WORKSPACE}/reports:/workspace" \
            -w /app \
            "${TEST_IMAGE}" \
            pytest testcases/ambient-healthcare/ \
              -m "${PYTEST_MARKER}" \
              --ambient-provider-playground-url http://localhost:5173 \
              --ambient-patient-voice-ui-url http://localhost:4400 \
              --ambient-agent-ui-url http://localhost:7861 \
              --timeout=600 \
              --disable-warnings -v \
              --junitxml=/workspace/ambient-healthcare-junit.xml \
              --html=/workspace/ambient-healthcare.html --self-contained-html

      - name: Collect compose logs
        if: failure()
        run: |
          set -uo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/reports"
          (cd "${PROVIDER_DIR}" && docker compose -f "${PROVIDER_COMPOSE}" --profile riva-nim logs --no-color) \
            > "${GITHUB_WORKSPACE}/reports/provider-compose.log" 2>&1 || true
          docker compose -f "${AGENT_COMPOSE}" logs --no-color \
            > "${GITHUB_WORKSPACE}/reports/agent-compose.log" 2>&1 || true
          docker compose --profile ace-controller -f "${VOICE_COMPOSE}" logs --no-color \
            > "${GITHUB_WORKSPACE}/reports/voice-compose.log" 2>&1 || true
          docker ps -a > "${GITHUB_WORKSPACE}/reports/docker-ps.txt" 2>&1 || true

      - name: Tear down the stacks
        if: always()
        run: |
          set -uo pipefail
          docker compose --profile ace-controller -f "${VOICE_COMPOSE}" down -v --remove-orphans || true
          docker compose -f "${AGENT_COMPOSE}" down -v --remove-orphans || true
          (cd "${PROVIDER_DIR}" && docker compose -f "${PROVIDER_COMPOSE}" --profile riva-nim down -v --remove-orphans) || true
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -w "${GITHUB_WORKSPACE}" \
            busybox chown -R "$(id -u):$(id -g)" . || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambient-healthcare-reports
          path: reports/
          retention-days: 30

      - name: Notify
        if: always()
        uses: dawidd6/action-send-mail@6e71c855c9a091d80a519621b9fd3e8d252ca40c
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Ambient Healthcare Agents CI ${{ job.status }} - ${{ github.repository }}@${{ github.ref_name }}"
          to: Github-Action-Blueprint-QA@nvidia.com
          from: github-workflow-notification@gmail.com
          html_body: |
            <p>Ambient Healthcare Agents UI regression finished with status
            <strong>${{ job.status }}</strong>.</p>
            <p>Repository: ${{ github.repository }}<br>
            Ref: ${{ github.ref_name }}<br>
            Selection: <code>-m ${{ env.PYTEST_MARKER }}</code></p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
            View the run and download ambient-healthcare.html</a></p>
