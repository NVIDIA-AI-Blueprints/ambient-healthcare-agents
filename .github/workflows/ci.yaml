# Runs the Ambient Healthcare Agents QA suite (UI tests) from the shared QA image
# against the provider and patient stacks deployed on this runner with hosted
# NVIDIA endpoints (build.nvidia.com, NVCF Riva); no GPU is needed.
#
# Required repository secrets:
#   NVIDIA_API_KEY         build.nvidia.com API key (nvapi-...).
#   NGC_API_KEY            NGC key used by the patient agent and voice stacks.
#   TEST_DOCKER_PULL_KEY   NVIDIA API key with pull access to the QA image.
# Optional SMTP secrets (mail step skipped if any are missing):
#   SMTP_USERNAME, SMTP_PASSWORD, SMTP_MAIL_TO, SMTP_MAIL_FROM

name: Blueprint QA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_image:
        description: QA test image
        required: false
        default: nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ambient-healthcare:
    name: Ambient Healthcare Agents
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
      QA_TEST_IMAGE: ${{ inputs.test_image || 'nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check secrets
        env:
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: |
          set -euo pipefail
          : "${NVIDIA_API_KEY:?NVIDIA_API_KEY secret missing}"
          : "${NGC_API_KEY:?NGC_API_KEY secret missing}"
          : "${TEST_DOCKER_PULL_KEY:?TEST_DOCKER_PULL_KEY secret missing}"

      - name: Deploy ambient provider
        working-directory: ambient-provider/ambient-scribe
        run: |
          set -euo pipefail
          cp apps/api/dot_env_example apps/api/.env
          sed -i \
            -e "s|^NVIDIA_API_KEY=.*|NVIDIA_API_KEY=${NVIDIA_API_KEY}|" \
            -e "s|^OPENAI_BASE_URL=.*|OPENAI_BASE_URL=https://integrate.api.nvidia.com/v1|" \
            -e "s|^SELF_HOSTED=.*|SELF_HOSTED=false|" \
            -e "s|^RIVA_URI=.*|RIVA_URI=grpc.nvcf.nvidia.com:443|" \
            -e "s|^RIVA_FUNCTION_ID=.*|RIVA_FUNCTION_ID=1598d209-5e27-4d3c-8079-4751568b1081|" \
            apps/api/.env
          cp apps/ui/.env.example apps/ui/.env
          make bootstrap
          make dev

      - name: Deploy ambient patient agent
        working-directory: ambient-patient
        run: |
          set -euo pipefail
          sed -i \
            -e "s|^NVIDIA_API_KEY=.*|NVIDIA_API_KEY=\"${NVIDIA_API_KEY}\"|" \
            -e "s|^NGC_API_KEY=.*|NGC_API_KEY=\"${NGC_API_KEY}\"|" \
            -e "s|^NEMO_GUARDRAILS_CONFIG_PATH=.*|NEMO_GUARDRAILS_CONFIG_PATH=nmgr-config-store/patient-intake-nemoguard|" \
            -e "s|^LANGSMITH_TRACING=.*|LANGSMITH_TRACING=false|" \
            agent/vars.env
          docker compose -f agent/docker-compose.yaml up --build -d app-server full-agent-ui

      - name: Deploy ambient patient voice
        working-directory: ambient-patient
        run: |
          set -euo pipefail
          sed -i \
            -e "s|^NGC_API_KEY=.*|NGC_API_KEY=${NGC_API_KEY}|" \
            -e "s|^NVIDIA_API_KEY=.*|NVIDIA_API_KEY=${NVIDIA_API_KEY}|" \
            -e "s|^CONFIG_PATH=.*|CONFIG_PATH=./configs/config_riva_public_endpoints.yaml|" \
            ace-controller-voice-interface/ace_controller.env
          docker compose --profile ace-controller -f ace-controller-voice-interface/docker-compose.yml up --build -d

      - name: Wait for services
        run: |
          set -euo pipefail
          for url in \
            http://localhost:8000/api/health/ \
            http://localhost:5173/ \
            http://localhost:8081/ \
            http://localhost:7861/ \
            http://localhost:7860/get_prompt \
            http://localhost:4400/; do
            ok=false
            for _ in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
              if [ "$code" != "000" ] && [ "${code:0:1}" != "5" ]; then
                ok=true
                break
              fi
              sleep 10
            done
            if [ "$ok" != true ]; then
              echo "::error::$url not ready after 10 minutes (last HTTP $code)"
              exit 1
            fi
            echo "$url ready (HTTP $code)"
          done

      - name: Run Ambient Healthcare tests
        env:
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: |
          set -euo pipefail
          echo "${TEST_DOCKER_PULL_KEY}" | docker login nvcr.io -u '$oauthtoken' --password-stdin
          docker pull "${QA_TEST_IMAGE}"
          rc=0
          docker run --rm -i --network host \
            -v "$(pwd):/blueprint" \
            "${QA_TEST_IMAGE}" bash -s <<'DOCKER_SCRIPT' || rc=$?
          set -uo pipefail
          cd /app
          rc=0
          pytest testcases/ambient-healthcare/ \
            -m "ambient_provider or ambient_patient_agent or ambient_patient_voice" \
            --ambient-provider-playground-url=http://localhost:5173 \
            --ambient-agent-ui-url=http://localhost:7861 \
            --ambient-patient-voice-ui-url=http://localhost:4400 \
            --disable-warnings -v --timeout=900 \
            --html=/blueprint/ambient-healthcare-test.html --self-contained-html || rc=$?
          cp -r /app/reports /blueprint/reports 2>/dev/null || true
          exit "$rc"
          DOCKER_SCRIPT
          if [ ! -f ambient-healthcare-test.html ]; then
            echo "::error::no pytest report written"
            exit 1
          fi
          exit "$rc"

      - name: Capture container logs
        if: failure()
        run: |
          mkdir -p ci-diagnostics
          docker compose -f ambient-provider/ambient-scribe/infra/compose.dev.yml logs --no-color > ci-diagnostics/ambient-provider.log 2>&1 || true
          docker compose -f ambient-patient/agent/docker-compose.yaml logs --no-color > ci-diagnostics/ambient-patient-agent.log 2>&1 || true
          docker compose --profile ace-controller -f ambient-patient/ace-controller-voice-interface/docker-compose.yml logs --no-color > ci-diagnostics/ambient-patient-voice.log 2>&1 || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambient-healthcare-test
          path: |
            ambient-healthcare-test.html
            reports/
            ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          docker compose -f ambient-provider/ambient-scribe/infra/compose.dev.yml down 2>/dev/null || true
          docker compose --profile ace-controller -f ambient-patient/ace-controller-voice-interface/docker-compose.yml down 2>/dev/null || true
          docker compose -f ambient-patient/agent/docker-compose.yaml down 2>/dev/null || true
          docker rmi "${QA_TEST_IMAGE}" 2>/dev/null || true
          docker image prune -f 2>/dev/null || true

      - name: Detect SMTP
        id: smtp
        if: always()
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_MAIL_TO: ${{ secrets.SMTP_MAIL_TO }}
          SMTP_MAIL_FROM: ${{ secrets.SMTP_MAIL_FROM }}
        run: |
          [ -n "${SMTP_USERNAME:-}" ] && [ -n "${SMTP_PASSWORD:-}" ] \
            && [ -n "${SMTP_MAIL_TO:-}" ] && [ -n "${SMTP_MAIL_FROM:-}" ] \
            && echo "enabled=true" >> "$GITHUB_OUTPUT" \
            || echo "enabled=false" >> "$GITHUB_OUTPUT"

      - name: Send mail
        if: always() && steps.smtp.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@6e71c855c9a091d80a519621b9fd3e8d252ca40c
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "QA Test Workflow Result for ${{ github.repository }}"
          to: ${{ secrets.SMTP_MAIL_TO }}
          from: ${{ secrets.SMTP_MAIL_FROM }}
          html_body: |
            <p>Workflow for <strong>${{ github.repository }}</strong> finished: <strong>${{ job.status }}</strong></p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run</a></p>
